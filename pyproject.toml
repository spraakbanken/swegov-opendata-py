[project]
name = "swegov-opendata"
version = "0.0.1"
description = "Data models for handling Swedish riksdagens öppna data (open data)"
readme = "README.md"
requires-python = ">= 3.11"
license = "MIT"
authors = [
  { name = "Språkbanken", email = "sb-info@svenska.gu.se" },
]
dependencies = [
  "pydantic>=2.12.5",
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = [
  "ruff>=0.16.9",
  "ty>=0.0.84",
]
test = [
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "syrupy>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "P7D"
